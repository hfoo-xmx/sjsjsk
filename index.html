<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Movie Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

header {
  padding: 18px 24px;
  border-bottom: 1px solid #29334d;
  font-size: 20px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

.hero {
  margin-bottom: 30px;
}

.hero small {
  color: #7888ff;
  letter-spacing: 3px;
}

h1 {
  font-size: 42px;
  margin: 10px 0;
}

.hero p {
  color: #9da8bd;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #11192c;
  border: 1px solid #293550;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
}

h2 {
  font-size: 18px;
  margin-top: 0;
}

.upload {
  min-height: 210px;
  border: 2px dashed #455274;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-align: center;
  padding: 20px;
}

.upload:hover {
  border-color: #7d8cff;
}

.upload input {
  display: none;
}

.upload-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

#filename {
  color: white;
  word-break: break-all;
}

#filesize {
  color: #8e9ab0;
  margin-top: 8px;
}

select,
textarea {
  width: 100%;
  background: #0a1121;
  color: white;
  border: 1px solid #303c5a;
  border-radius: 9px;
  padding: 12px;
  margin: 8px 0 15px;
}

textarea {
  height: 300px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #7183ff;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.progress {
  width: 100%;
  height: 8px;
  background: #070b15;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 20px;
}

#bar {
  width: 0%;
  height: 100%;
  background: #7183ff;
  transition: width .4s;
}

#status {
  margin-top: 10px;
  color: #9ba7bc;
  font-size: 14px;
}

.preview {
  min-height: 300px;
  background: #070c16;
  border: 1px solid #293550;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #758199;
  padding: 20px;
}

@media(max-width:750px) {
  .grid {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 32px;
  }
}
</style>
</head>

<body>

<header>
🎬 AI Movie Studio
</header>

<main>

<section class="hero">
  <small>AI VIDEO FACTORY</small>

  <h1>一部电影，自动生成 AI 解说</h1>

  <p>
    上传电影 / 短剧 → AI分析 → 自动生成解说
  </p>
</section>


<div class="grid">

  <div class="card">

    <h2>① 上传电影 / 短剧</h2>

    <label class="upload">

      <input
        id="video"
        type="file"
        accept="video/*"
      >

      <div class="upload-icon">↑</div>

      <strong id="filename">
        点击选择视频
      </strong>

      <div id="filesize">
        MP4 / MOV / WebM
      </div>

    </label>

  </div>


  <div class="card">

    <h2>② AI生成设置</h2>

    <label>
      解说类型
    </label>

    <select id="style">

      <option>电影解说</option>
      <option>悬疑解说</option>
      <option>情感故事</option>
      <option>爆款短视频</option>

    </select>


    <label>
      目标时长
    </label>

    <select id="duration">

      <option>60秒</option>
      <option>90秒</option>
      <option selected>5分钟</option>
      <option>10分钟</option>

    </select>


    <button id="generate">
      🚀 开始分析视频
    </button>

  </div>

</div>


<div class="card">

  <h2>③ AI生产进度</h2>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="status">
    等待选择视频
  </div>

</div>


<div class="grid">

  <div class="card">

    <h2>④ AI分析结果</h2>

    <textarea
      id="script"
      placeholder="视频分析结果会出现在这里……"
    ></textarea>

  </div>


  <div class="card">

    <h2>⑤ 视频预览</h2>

    <div
      class="preview"
      id="preview"
    >
      等待上传视频
    </div>

  </div>

</div>

</main>


<script>

const video =
  document.getElementById("video");

const filename =
  document.getElementById("filename");

const filesize =
  document.getElementById("filesize");

const status =
  document.getElementById("status");

const bar =
  document.getElementById("bar");

const script =
  document.getElementById("script");

const generate =
  document.getElementById("generate");


/* =========================
   选择视频
========================= */

video.addEventListener(
  "change",
  function () {

    if (
      !this.files ||
      !this.files.length
    ) {

      filename.innerText =
        "点击选择视频";

      filesize.innerText =
        "MP4 / MOV / WebM";

      status.innerText =
        "等待选择视频";

      return;
    }


    const file =
      this.files[0];


    filename.innerText =
      file.name;


    filesize.innerText =
      (
        file.size /
        1024 /
        1024
      ).toFixed(2) +
      " MB";


    status.innerText =
      "视频已选择，可以开始分析";


    bar.style.width =
      "0%";

  }
);


/* =========================
   开始分析
========================= */

generate.addEventListener(
  "click",
  async function () {

    if (
      !video.files ||
      !video.files.length
    ) {

      alert(
        "请先选择一个视频"
      );

      return;
    }


    const file =
      video.files[0];


    generate.disabled =
      true;


    status.innerText =
      "正在上传视频……";


    bar.style.width =
      "15%";


    try {

      const formData =
        new FormData();


      formData.append(
        "video",
        file
      );


      const response =
        await fetch(

          "https://ai-movie-backend-v2.onrender.com/api/analyze-video",

          {
            method: "POST",
            body: formData
          }

        );


      bar.style.width =
        "60%";


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "服务器处理失败"
        );

      }


      bar.style.width =
        "100%";


      status.innerText =
        "✅ 视频分析完成";


      script.value =

`🎬 视频已经成功发送到 AI 服务器。

━━━━━━━━━━━━━━━━

文件：

${data.filename || file.name}

━━━━━━━━━━━━━━━━

AI语音识别：

${data.transcript || "暂无"}

━━━━━━━━━━━━━━━━

AI剧情分析：

${data.summary || "暂无"}

━━━━━━━━━━━━━━━━

下一阶段：

自动生成专业电影解说稿。`;


      document.getElementById(
        "preview"
      ).innerText =
        "🎬 视频已经被服务器接收";


    }

    catch (error) {

      console.error(error);


      status.innerText =
        "❌ 视频处理失败";


      script.value =
        "错误：\n\n" +
        error.message;


      bar.style.width =
        "0%";

    }


    finally {

      generate.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
