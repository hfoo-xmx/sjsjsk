<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Movie Studio</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Microsoft YaHei",sans-serif;
background:#080d18;
color:white;
}

header{
padding:18px 25px;
border-bottom:1px solid #26304a;
font-size:20px;
font-weight:bold;
}

main{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.hero{
margin-bottom:35px;
}

.hero small{
color:#7789ff;
letter-spacing:3px;
font-weight:bold;
}

h1{
font-size:44px;
margin:12px 0;
}

.hero p{
color:#9ba7bf;
font-size:17px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#11192c;
border:1px solid #283450;
border-radius:16px;
padding:22px;
margin-bottom:20px;
}

h2{
font-size:18px;
margin-top:0;
}

.upload{
height:220px;
border:2px dashed #455274;
border-radius:14px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
color:#aab5ca;
}

.upload:hover{
border-color:#7c8cff;
}

.upload input{
display:none;
}

.upload-icon{
font-size:40px;
margin-bottom:10px;
}

select,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
background:#0a1121;
border:1px solid #303c5a;
border-radius:9px;
color:white;
font-size:15px;
}

textarea{
height:280px;
resize:vertical;
}

button{
width:100%;
padding:14px;
border:0;
border-radius:10px;
background:#7183ff;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#8795ff;
}

.steps{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.step{
background:#0b1325;
border:1px solid #293550;
border-radius:10px;
padding:14px 5px;
text-align:center;
color:#9ba6bd;
font-size:13px;
}

.step b{
display:block;
font-size:20px;
color:white;
margin-bottom:7px;
}

.progress{
height:8px;
background:#070b15;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

#bar{
height:100%;
width:0%;
background:#7183ff;
transition:.4s;
}

#status{
margin-top:10px;
color:#9aa6be;
font-size:13px;
}

.preview{
height:280px;
border:1px solid #293550;
border-radius:12px;
background:#070c16;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#6f7b94;
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr;
}

.steps{
grid-template-columns:1fr 1fr;
}

h1{
font-size:32px;
}

}

</style>
</head>


<body>

<header>
🎬 AI Movie Studio
</header>


<main>

<div class="hero">

<small>AI VIDEO FACTORY</small>

<h1>
一部电影，自动生成 AI 解说
</h1>

<p>
上传电影 / 短剧 → AI分析 → 自动生成解说稿
</p>

</div>


<div class="grid">


<div class="card">

<h2>① 上传电影 / 短剧</h2>

<label class="upload">

<input
id="video"
type="file"
accept="video/*"
>

<div class="upload-icon">
↑
</div>

<strong id="filename">
点击选择视频
</strong>

<small>
MP4 / MOV / MKV
</small>

</label>

</div>



<div class="card">

<h2>② AI生成设置</h2>


<label>
解说类型

<select id="style">

<option>
电影解说
</option>

<option>
悬疑解说
</option>

<option>
情感故事
</option>

<option>
爆款短视频
</option>

</select>

</label>


<label>
目标时长

<select id="duration">

<option>
60秒
</option>

<option>
90秒
</option>

<option selected>
5分钟
</option>

<option>
10分钟
</option>

</select>

</label>


<button onclick="generateAI()">

🚀 开始生成 AI 解说

</button>

</div>

</div>



<div class="card">

<h2>
③ AI生产流程
</h2>


<div class="steps">

<div class="step">
<b>01</b>
视频分析
</div>

<div class="step">
<b>02</b>
剧情理解
</div>

<div class="step">
<b>03</b>
AI编剧
</div>

<div class="step">
<b>04</b>
配音字幕
</div>

<div class="step">
<b>05</b>
自动剪辑
</div>

</div>


<div class="progress">

<div id="bar"></div>

</div>


<div id="status">

等待开始

</div>

</div>



<div class="grid">


<div class="card">

<h2>
④ AI解说稿
</h2>

<textarea
id="script"
placeholder="AI生成的解说稿会出现在这里……"
></textarea>

</div>


<div class="card">

<h2>
⑤ 视频预览
</h2>

<div
class="preview"
id="preview"
>

AI视频生成后将在这里播放

</div>

</div>

</div>


</main>



<script>


const video =
document.getElementById("video");


const filename =
document.getElementById("filename");


video.addEventListener(
"change",
function(){

if(this.files.length){

filename.innerText =
this.files[0].name;

}

}
);



async function generateAI(){


if(!video.files.length){

alert(
"请先选择一个视频"
);

return;

}


const status =
document.getElementById("status");


const bar =
document.getElementById("bar");


const script =
document.getElementById("script");


const style =
document.getElementById("style").value;


const duration =
document.getElementById("duration").value;



status.innerText =
"正在连接 AI 服务器……";


bar.style.width =
"20%";



try{


const response =
await fetch(

"https://ai-movie-backend-f9g1.onrender.com/api/generate-script",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

movieInfo:
`用户上传了一部电影/短剧。

当前阶段是AI电影解说MVP测试。

请生成一个电影解说示例。`,

style:style,

duration:duration

})

}

);



const data =
await response.json();



if(!response.ok){

throw new Error(
data.error ||
"服务器返回错误"
);

}



bar.style.width =
"100%";


status.innerText =
"✅ AI解说生成完成";


script.value =
data.script;


document.getElementById(
"preview"
).innerHTML =

"🎬 AI解说已经生成<br><br>" +

"下一阶段：<br>" +

"自动分析真实电影画面<br>" +

"→ 自动选择片段<br>" +

"→ AI配音<br>" +

"→ 自动字幕<br>" +

"→ 输出MP4";


}
catch(error){


console.error(error);


status.innerText =
"❌ AI生成失败";


script.value =
"错误：\n\n" +
error.message;


}

}


</script>

</body>
</html>
